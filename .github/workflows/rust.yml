name: Rust

on:
  push:
    branches: [main, rust-bevy-port]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Bevy system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo test -p citymind-core
      - run: cargo check --workspace
      - name: Smoke test save and resume
        run: |
          cargo run -p citymind-cli -- --population 20 --max-population 30 --ticks 5 --save-state /tmp/citymind-state.json
          cargo run -p citymind-cli -- --load-state /tmp/citymind-state.json --ticks 5 --output /tmp/citymind-scenario.json
