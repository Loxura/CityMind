name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_performance_test:
        description: Run the opt-in browser tick-rate check
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run verification suite
        run: npm run verify

      - name: Run tick-rate check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_performance_test }}
        run: npm run test:perf

      - name: Upload browser artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: /tmp/citymind-playwright
          if-no-files-found: ignore
